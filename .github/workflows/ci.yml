name: CI
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Unit Tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # make is not on PATH on the Windows runner, so both legs call go directly.
      - run: go test -short ./...

  integration:
    name: Integration Tests
    # Fork and dependabot PRs never receive secrets, so the job could only skip.
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/cache@v6
        with:
          path: ~/.cache/infracost/plugins
          key: ${{ runner.os }}-scanner-plugins-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-scanner-plugins-

      # Without a token every integration test skips and the job is green
      # having run nothing.
      - name: Check token is set
        env:
          TOKEN: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "INFRACOST_CLI_AUTHENTICATION_TOKEN is not set, integration tests would all skip."
            exit 1
          fi

      - run: make test-integration
        env:
          INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10

  mocks:
    name: Mocks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: make mocks

      - name: Check for changes
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Mock files are out of date. Please run 'make mocks' and commit the changes."
            git status --porcelain --untracked-files=all
            exit 1
          fi

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-24.04, native: true }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04 }
          - { goos: darwin, goarch: amd64, runner: macos-latest }
          - { goos: darwin, goarch: arm64, runner: macos-latest, native: true }
          - { goos: windows, goarch: amd64, runner: ubuntu-24.04 }
          - { goos: windows, goarch: arm64, runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ci-test
        run: |
          # Static for linux and windows: the published archive should run on
          # musl and in scratch/distroless. darwin keeps cgo — without it Go
          # drops libSystem for its own resolver, which reads /etc/resolv.conf
          # only and misses the /etc/resolver/* a VPN writes for split-horizon
          # DNS, the likely setup for a self-hosted pricing endpoint.
          if [ "$GOOS" != "darwin" ]; then
            export CGO_ENABLED=0
          fi

          BINARY="infracost-scanner"
          if [ "$GOOS" = "windows" ]; then
            BINARY="infracost-scanner.exe"
          fi
          go build \
            -ldflags "-X github.com/infracost/ci/internal/version.Version=${VERSION}" \
            -o "bin/${BINARY}" \
            .

      # -X against a symbol that does not exist is silently ignored, so the
      # ldflags path is only proven by running the binary. Cross-compiled
      # matrix entries cannot run their own output.
      - name: Assert version ldflags
        if: matrix.native
        env:
          VERSION: ci-test
        run: ./bin/infracost-scanner --version | grep -qxF "scanner version $VERSION"

      # Mirrors release.yml: the .exe suffix and the zip are otherwise first
      # exercised mid-release, after the draft has been created.
      - name: Package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          if [ "$GOOS" = "windows" ]; then
            (cd bin && zip -q "../dist/infracost-scanner_${GOOS}_${GOARCH}.zip" infracost-scanner.exe)
          else
            tar -czf "dist/infracost-scanner_${GOOS}_${GOARCH}.tar.gz" -C bin infracost-scanner
          fi

      # Only the Windows archives leave this job. They are the ones nothing
      # else opens, and the zip has to cross runners to be worth extracting.
      - uses: actions/upload-artifact@v4
        if: matrix.goos == 'windows'
        with:
          name: ci-infracost-scanner_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  # The zip is written on Linux by a tool Windows never runs, and until now
  # nothing opened it before a release. release.yml's verify-windows does the
  # same against published assets, but only at release time and only once the
  # repository is public.
  verify-windows:
    name: Verify Windows archive
    runs-on: windows-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-infracost-scanner_windows_*
          merge-multiple: true
          path: dist

      - name: Extract and run
        shell: pwsh
        env:
          VERSION: ci-test
        run: |
          $ErrorActionPreference = "Stop"

          # Expand-Archive, not unzip: it is what the README recipe tells a
          # user to run, so it is the thing worth proving.
          foreach ($Arch in "amd64", "arm64") {
            $Archive = "dist/infracost-scanner_windows_$Arch.zip"
            Expand-Archive -Path $Archive -DestinationPath $Arch -Force
            if (-not (Test-Path "$Arch/infracost-scanner.exe")) {
              throw "$Archive contains no infracost-scanner.exe"
            }
          }

          # windows-latest is x64, so only the amd64 binary can be executed here.
          $Out = (& ./amd64/infracost-scanner.exe --version | Select-Object -First 1).Trim()
          if ($Out -ne "scanner version $env:VERSION") {
            throw "expected 'scanner version $env:VERSION', got '$Out'"
          }

  # amd64 only and never pushed: release.yml is otherwise the first run of the
  # Dockerfile, and it fails there after the draft and archives are published.
  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # dist/${TARGETARCH}/ is the layout release.yml lays out from the archives.
      - name: Build into dist/
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: go build -o dist/amd64/infracost-scanner .

      - run: docker build . --tag infracost-ci:ci

      - name: Smoke test
        run: |
          docker run --rm infracost-ci:ci --version
          docker run --rm -v "$PWD/internal/commands/testdata/basic/head:/src" \
            infracost-ci:ci plugins detect --path /src
