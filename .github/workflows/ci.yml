name: CI
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Unit Tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # make is not on PATH on the Windows runner, so both legs call go directly.
      - run: go test -short ./...

  integration:
    name: Integration Tests
    # Fork and dependabot PRs never receive secrets, so the job could only skip.
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/cache@v6
        with:
          path: ~/.cache/infracost/plugins
          key: ${{ runner.os }}-scanner-plugins-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-scanner-plugins-

      # Without a token every integration test skips and the job is green
      # having run nothing.
      - name: Check token is set
        env:
          TOKEN: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "INFRACOST_CLI_AUTHENTICATION_TOKEN is not set, integration tests would all skip."
            exit 1
          fi

      - run: make test-integration
        env:
          INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10

  mocks:
    name: Mocks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: make mocks

      - name: Check for changes
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Mock files are out of date. Please run 'make mocks' and commit the changes."
            git status --porcelain --untracked-files=all
            exit 1
          fi

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-24.04, native: true }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04 }
          - { goos: darwin, goarch: amd64, runner: macos-latest }
          - { goos: darwin, goarch: arm64, runner: macos-latest, native: true }
          - { goos: windows, goarch: amd64, runner: ubuntu-24.04 }
          - { goos: windows, goarch: arm64, runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ci-test
        run: |
          BINARY="infracost-scanner"
          if [ "$GOOS" = "windows" ]; then
            BINARY="infracost-scanner.exe"
          fi
          go build \
            -ldflags "-X github.com/infracost/ci/internal/version.Version=${VERSION}" \
            -o "bin/${BINARY}" \
            .

      # -X against a symbol that does not exist is silently ignored, so the
      # ldflags path is only proven by running the binary. Cross-compiled
      # matrix entries cannot run their own output.
      - name: Assert version ldflags
        if: matrix.native
        env:
          VERSION: ci-test
        run: ./bin/infracost-scanner --version | grep -qxF "scanner version $VERSION"

      # Mirrors release.yml: the .exe suffix and the zip are otherwise first
      # exercised mid-release, after the draft has been created.
      - name: Package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          if [ "$GOOS" = "windows" ]; then
            (cd bin && zip -q "../dist/infracost-scanner_${GOOS}_${GOARCH}.zip" infracost-scanner.exe)
          else
            tar -czf "dist/infracost-scanner_${GOOS}_${GOARCH}.tar.gz" -C bin infracost-scanner
          fi
