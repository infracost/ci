name: Release
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to be released (e.g., 0.1.0)"
        type: string
        required: true

permissions: {}

# Keyed on the version, normalised so a dispatch and a tag push of the same
# version share a group. A workflow-wide key would evict a queued release of a
# different version: GitHub keeps only one pending run per group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # A dispatch can name any ref, which would release unreviewed code.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW_VERSION="$INPUT_VERSION"
          else
            RAW_VERSION="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${RAW_VERSION#v}"

          # =~ matches the whole string; grep is line-based, so a newline in a
          # dispatch input would smuggle extra keys into $GITHUB_OUTPUT.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version '$VERSION' is not a semver x.y.z[-pre] version."
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

  # ci.yml only runs on push to main and pull_request, so nothing else stops a
  # tag on a red commit from being built, published and marked latest.
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: version
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: go test -short ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10

  draft-release:
    name: Draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [version, test]
    # Second gate for the write-scoped jobs, after the version job's ref check.
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check for existing release
        id: check-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "EXISTS=true" >> "$GITHUB_OUTPUT"
          else
            echo "EXISTS=false" >> "$GITHUB_OUTPUT"
          fi

      # gh release create drops --target when the tag ref already exists, which
      # would leave the release describing a commit it was not built from.
      - name: Check the tag points at this commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          TAG_SHA=$(gh api "repos/${REPOSITORY}/commits/${TAG}" --jq .sha 2>/dev/null || true)
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$TARGET" ]; then
            echo "Tag $TAG is at $TAG_SHA but this run builds $TARGET. Release a new version."
            exit 1
          fi

      - name: Create draft release
        if: steps.check-release.outputs.EXISTS == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          VERSION: ${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          # --target pins the tag to the built commit; a dispatch would
          # otherwise tag the default branch while the build uses github.ref.
          gh release create "$TAG" \
            --repo "$REPOSITORY" \
            --target "$TARGET" \
            --title "Scanner $VERSION" \
            --generate-notes \
            --draft

      # Drafting a published release 404s every pinned download and hands
      # latest back to the previous version, so refuse instead.
      - name: Refuse to rebuild a published release
        if: steps.check-release.outputs.EXISTS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          IS_DRAFT=$(gh release view "$TAG" --repo "$REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$IS_DRAFT" != "true" ]; then
            echo "Release $TAG is already published. Release a new version instead of re-running."
            exit 1
          fi

      # A draft keeps the target of the run that created it, so a re-run would
      # otherwise tag an older commit than the one these binaries come from.
      - name: Point the existing draft at this commit
        if: steps.check-release.outputs.EXISTS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: gh release edit "$TAG" --repo "$REPOSITORY" --target "$TARGET"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    needs: [version, draft-release]
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-24.04, native: true }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04 }
          - { goos: darwin, goarch: amd64, runner: macos-latest }
          - { goos: darwin, goarch: arm64, runner: macos-latest, native: true }
          - { goos: windows, goarch: amd64, runner: ubuntu-24.04 }
          - { goos: windows, goarch: arm64, runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Static for linux and windows: the published archive should run on
          # musl and in scratch/distroless. darwin keeps cgo — without it Go
          # drops libSystem for its own resolver, which reads /etc/resolv.conf
          # only and misses the /etc/resolver/* a VPN writes for split-horizon
          # DNS, the likely setup for a self-hosted pricing endpoint.
          if [ "$GOOS" != "darwin" ]; then
            export CGO_ENABLED=0
          fi

          BINARY="infracost-scanner"
          if [ "$GOOS" = "windows" ]; then
            BINARY="infracost-scanner.exe"
          fi
          go build \
            -ldflags "-X github.com/infracost/ci/internal/version.Version=${VERSION}" \
            -o "bin/${BINARY}" \
            .

      # -X against a symbol that does not exist is silently ignored, so the
      # ldflags path is only proven by running the binary. Cross-compiled
      # matrix entries cannot run their own output.
      - name: Assert version ldflags
        if: matrix.native
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./bin/infracost-scanner --version | grep -qxF "scanner version $VERSION"

      # No version in the asset name: the latest/download redirect only works
      # while the name is identical across releases.
      - name: Package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          if [ "$GOOS" = "windows" ]; then
            (cd bin && zip -q "../dist/infracost-scanner_${GOOS}_${GOARCH}.zip" infracost-scanner.exe)
          else
            tar -czf "dist/infracost-scanner_${GOOS}_${GOARCH}.tar.gz" -C bin infracost-scanner
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: infracost-scanner_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  checksums:
    name: Checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [version, build]
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: infracost-scanner_*
          merge-multiple: true
          path: dist

      # Hashed in one Linux job: the build matrix spans runners that disagree
      # on the tool (sha256sum vs shasum) and on the output format.
      - name: Generate checksums
        working-directory: dist
        run: |
          ls -1
          sha256sum infracost-scanner_* > checksums.txt
          cat checksums.txt

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release upload "$TAG" ./dist/* \
            --repo "$REPOSITORY" \
            --clobber

  publish:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [version, checksums]
    environment: release
    permissions:
      contents: write
    outputs:
      latest: ${{ steps.publish.outputs.LATEST }}
    steps:
      - name: Publish release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          VERSION: ${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # A prerelease must not take over the latest/download redirect.
          LATEST="--latest"
          case "$VERSION" in *-*) LATEST="--prerelease" ;; esac

          # --latest overrides GitHub's ordering, so a hotfix cut from an old
          # branch would silently downgrade every floating install.
          if [ "$LATEST" = "--latest" ]; then
            CURRENT=$(gh release view --repo "$REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
            NEWEST=$(printf '%s\n%s\n' "${CURRENT#v}" "$VERSION" | sort -V | tail -1)
            if [ -n "$CURRENT" ] && [ "$NEWEST" != "$VERSION" ]; then
              echo "Release $CURRENT is newer than $TAG, leaving the latest redirect alone."
              LATEST="--latest=false"
            fi
          fi

          if [ "$LATEST" = "--latest" ]; then
            echo "LATEST=true" >> "$GITHUB_OUTPUT"
          else
            echo "LATEST=false" >> "$GITHUB_OUTPUT"
          fi
          gh release edit "$TAG" \
            --repo "$REPOSITORY" \
            --draft=false \
            "$LATEST"

  # Deliberately has no GH_TOKEN and no checkout: a step with credentials in
  # scope cannot demonstrate that the download needs none.
  verify:
    name: Verify anonymous download
    runs-on: ubuntu-24.04
    # A hung verify leaves a published, unverified release in latest until
    # rollback can run, so cap it well under the 6h default.
    timeout-minutes: 10
    needs: [version, publish]
    # An anonymous download cannot work while the repo is private, and rollback
    # would then draft every release it publishes. Drop this with FIX-726.
    if: ${{ !github.event.repository.private }}
    permissions: {}
    steps:
      - name: Download assets with curl
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          BASE="https://github.com/${REPOSITORY}/releases/download/${TAG}"
          mkdir -p verify && cd verify
          # Assets can 404 for a few seconds after the release is published.
          CURL="curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors -O"
          $CURL "${BASE}/checksums.txt"

          # Driven by checksums.txt so a new build matrix entry cannot go unchecked.
          while read -r _ ASSET; do
            $CURL "${BASE}/${ASSET}"
          done < checksums.txt

      - name: Verify checksums
        working-directory: verify
        run: sha256sum -c checksums.txt

      - name: Verify binary reports the released version
        working-directory: verify
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tar -xzf infracost-scanner_linux_amd64.tar.gz
          ./infracost-scanner --version | grep -qxF "scanner version $VERSION"

      # Only assert the redirect when this release actually claimed it.
      - name: Verify the latest redirect resolves to this release
        if: needs.publish.outputs.latest == 'true'
        working-directory: verify
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          # Compared, not just fetched: a 200 also passes on the old release.
          curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors \
            -o latest-checksums.txt "https://github.com/${REPOSITORY}/releases/latest/download/checksums.txt"
          diff latest-checksums.txt checksums.txt

  # The Linux leg cannot extract a zip member it has no way to run, so the .exe
  # name and the zip layout are asserted here. Mirrors the README recipe.
  verify-windows:
    name: Verify Windows archive
    runs-on: windows-latest
    timeout-minutes: 10
    needs: [version, publish]
    if: ${{ !github.event.repository.private }}
    permissions: {}
    steps:
      - name: Download, extract and run the Windows archive
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.version }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $Base = "https://github.com/$env:REPOSITORY/releases/download/$env:TAG"

          # Assets can 404 for a few seconds after the release is published.
          function Get-Asset($Name) {
            for ($i = 1; $i -le 6; $i++) {
              try {
                Invoke-WebRequest -UseBasicParsing -Uri "$Base/$Name" -OutFile $Name
                return
              } catch {
                Start-Sleep -Seconds 5
              }
            }
            throw "failed to download $Name"
          }

          Get-Asset "checksums.txt"
          foreach ($Arch in "amd64", "arm64") {
            $Archive = "infracost-scanner_windows_$Arch.zip"
            Get-Asset $Archive
            $Expected = (Select-String -Path checksums.txt -Pattern " $Archive$").Line.Split(" ")[0]
            $Actual = (Get-FileHash -Algorithm SHA256 $Archive).Hash.ToLower()
            if ($Expected -ne $Actual) { throw "checksum mismatch for $Archive" }

            Expand-Archive -Path $Archive -DestinationPath $Arch -Force
            if (-not (Test-Path "$Arch/infracost-scanner.exe")) {
              throw "$Archive contains no infracost-scanner.exe"
            }
          }

          # windows-latest is x64, so only the amd64 binary can be executed here.
          $Out = (& ./amd64/infracost-scanner.exe --version | Select-Object -First 1).Trim()
          if ($Out -ne "scanner version $env:VERSION") {
            throw "expected 'scanner version $env:VERSION', got '$Out'"
          }

  # verify runs after publish, so a failure must pull the release back out of
  # latest rather than leave anonymous installs on a broken version.
  rollback:
    name: Rollback to draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [version, publish, verify, verify-windows]
    # Cancelled counts too: a cancelled verify leaves an unverified release in
    # latest. A skipped one (private repo) does not, so it must not match.
    if: always() && needs.publish.result == 'success' && (contains(fromJSON('["failure", "cancelled"]'), needs.verify.result) || contains(fromJSON('["failure", "cancelled"]'), needs['verify-windows'].result))
    # No environment: an approval gate here would strand a bad release in latest.
    permissions:
      contents: write
    steps:
      - name: Draft the release again
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release edit "$TAG" \
            --repo "$REPOSITORY" \
            --draft

  # Hangs off build, not publish: it consumes the uploaded artifacts, so a GHCR
  # failure cannot block the archives from publishing.
  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [version, build]
    environment: release
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.DIGEST }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: infracost-scanner_linux_*
          path: artifacts

      # The Dockerfile COPYs dist/${TARGETARCH}/, which is how one Dockerfile
      # serves both platforms. The image ships the bytes that were released;
      # there is no Go toolchain in it.
      - name: Lay out dist/
        run: |
          for ARCH in amd64 arm64; do
            mkdir -p "dist/${ARCH}"
            tar -xzf "artifacts/infracost-scanner_linux_${ARCH}/infracost-scanner_linux_${ARCH}.tar.gz" \
              -C "dist/${ARCH}"
          done
          ls -l dist/*/

      # arm64 is emulated rather than built on ubuntu-24.04-arm, which is not
      # available on private-repository plans. Only apk and the plugin install
      # are architecture-specific; the binaries are copied, not compiled.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # UpdatePlugins resolves "latest" at build time, so what an image contains
      # is only knowable by asking it. Built with --load first so the answer
      # comes from the image itself; the push below reuses the buildx cache.
      - name: Resolve the plugin versions this build got
        id: plugins
        run: |
          docker buildx build . --platform linux/amd64 --load --tag infracost-ci:probe
          JSON=$(docker run --rm infracost-ci:probe plugins list --format json | jq -c .)
          echo "JSON=$JSON" >> "$GITHUB_OUTPUT"

      # Pushed untagged. A tag here would survive a rollback: image only needs
      # build, so it lands while the release is still a draft, and every later
      # gate — checksums, publish, verify, verify-windows — can still fail and
      # send rollback to re-draft. The archives then 404, but a tag does not
      # un-push, leaving :VERSION serving bytes from a release that officially
      # does not exist. Every tag is applied by image-tag, downstream of all of
      # them. Labels are applied by hand rather than through build-push-action,
      # whose label list is comma-separated and so cannot carry JSON.
      - name: Build and push
        id: push
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          PLUGINS: ${{ steps.plugins.outputs.JSON }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          # Provenance left on: the attestation manifests carry unknown/unknown
          # and are skipped by a pull --platform, so it is the only thing tying
          # the image back to this workflow.
          docker buildx build . \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/${REPOSITORY}" \
            --label "org.opencontainers.image.revision=${REVISION}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "io.infracost.plugins=${PLUGINS}" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file metadata.json

          DIGEST=$(jq -r '."containerimage.digest"' metadata.json)
          echo "DIGEST=$DIGEST" >> "$GITHUB_OUTPUT"

  # A failure here has no rollback by design: image-tag never runs, so no tag is
  # ever created and every floating tag stays on the previous release. The
  # untagged manifest is the only remainder, and nothing can resolve it.
  image-verify:
    name: Verify image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [version, image]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      # Only needed while the package inherits the repository's private
      # visibility. Drop it with FIX-726, the way the archive verify has no
      # GH_TOKEN.
      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Pulled by digest from the manifest list so the check cannot drift onto
      # a different push. Under QEMU the arm64 leg proves ELF architecture and
      # that the binaries are not corrupt — not that they run on real hardware.
      - name: Verify both platforms
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ needs.image.outputs.digest }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          REF="${IMAGE}@${DIGEST}"
          TESTDATA="${GITHUB_WORKSPACE}/internal/commands/testdata"

          for PLATFORM in linux/amd64 linux/arm64; do
            echo "::group::$PLATFORM"

            # The child digest, not the list: pulling one manifest-list digest
            # twice under different --platform fails with "cannot overwrite
            # digest". Children come from that list, so this still cannot drift.
            CHILD=$(docker buildx imagetools inspect --raw "$REF" |
              jq -er --arg p "$PLATFORM" '.manifests[]
                | select(.platform.os + "/" + .platform.architecture == $p)
                | .digest')
            PREF="${IMAGE}@${CHILD}"

            docker pull -q --platform "$PLATFORM" "$PREF"
            RUN="docker run --rm --platform $PLATFORM"

            # A bad -X is silent, so the version is only proven by running it.
            $RUN "$PREF" --version | grep -qxF "scanner version $VERSION"

            # Exits non-zero unless every required plugin is installed and
            # answered GetPluginInfo, so the assertion is the exit code — no
            # count here, which would need editing every time the required set
            # changes. Non-emptiness is the one thing it cannot self-assert.
            $RUN "$PREF" plugins list --format json > list.json
            jq -e '[.[] | select(.required)] | length > 0' list.json > /dev/null

            # The label is probed once on amd64 but carried by both manifests,
            # so a plugin released between the two builds would make it a lie.
            docker inspect --format '{{ index .Config.Labels "io.infracost.plugins" }}' "$PREF" |
              jq -S 'map({key, version}) | sort' > label.json
            jq -S 'map({key, version}) | sort' list.json > installed.json
            diff label.json installed.json

            # detect is the closest thing to a scan that runs without a token.
            # basic/head has no infracost.yml, so the terraform parser is asked
            # to identify projects in real HCL over gRPC.
            for NETWORK in bridge none; do
              $RUN --network "$NETWORK" -v "${TESTDATA}/basic/head:/src" "$PREF" \
                plugins detect --path /src

              $RUN --network "$NETWORK" -v "${TESTDATA}/multi-project/head:/src" "$PREF" \
                plugins detect --path /src > detect.txt
              cat detect.txt
              grep -qE '^web[[:space:]]' detect.txt
              grep -qE '^api[[:space:]]' detect.txt
            done

            # The README's runAsNonRoot recipe: uid 65532 has no home in the
            # image, so the caches under HOME are what a bare --user breaks.
            $RUN --user 65532 -e HOME=/tmp -v "${TESTDATA}/basic/head:/src" "$PREF" \
              plugins detect --path /src

            # How an Azure Pipelines container: job holds the container open
            # before exec'ing its steps. A scanner entrypoint would have exited.
            CID=$(docker run -d --platform "$PLATFORM" "$PREF" bash -c "sleep infinity")
            docker exec "$CID" scanner --version | grep -qxF "scanner version $VERSION"
            docker rm -f "$CID" > /dev/null
            echo "::endgroup::"
          done

  image-tag:
    name: Tag image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [version, publish, image, image-verify, verify, verify-windows]
    # verify is skipped while the repo is private, and a skipped need would
    # cascade, so it is gated on the result: a verify that failed sends rollback
    # to re-draft the release, and latest must not point at that version.
    if: ${{ !cancelled() && !failure() && needs.verify.result != 'cancelled' && needs['verify-windows'].result != 'cancelled' }}
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The first tag the package gets. image pushed by digest only, so until
      # this step there is nothing for a pull to resolve — which is what keeps
      # a rolled-back release from leaving a usable :VERSION behind.
      - name: Apply the version tag
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            "${IMAGE}@${DIGEST}"

      # latest and the minor tag are what every install recipe points at, so
      # they only move when publish decided this release claimed latest.
      - name: Apply the floating tags
        if: needs.publish.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: v${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          # The concurrency group is keyed by version, so two releases can be
          # in flight at once and publish decided this one was newest before
          # the other existed. Between there and here the answer can change,
          # and an older run arriving second would drag latest backwards.
          CURRENT=$(gh release view --repo "$REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          if [ -n "$CURRENT" ] && [ "$CURRENT" != "$TAG" ]; then
            echo "$CURRENT is the latest release now, not $TAG. Leaving the floating tags alone."
            exit 0
          fi

          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION%.*}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}@${DIGEST}"

      # checksums.txt hashes the tarballs and says nothing about the image, so
      # an image consumer otherwise has no published hash to pin against.
      - name: Publish the manifest digest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          echo "$DIGEST" > image-digest.txt
          gh release upload "$TAG" image-digest.txt --repo "$REPOSITORY" --clobber
